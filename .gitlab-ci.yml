image: alpine:3.20

# Pipeline: deploy automatizado de back + front SOLO en tags semver (con prerelease opcional).
# sso-server (dowardev/sso-server) y sso-client (@dowardev/sso-client) son dependencias externas publicadas en Packagist/npm.

stages:
  - lint
  - test
  - build
  - deploy
  - rollback

variables:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  # Version of @dowardev/sso-client that CI resolves from npm (the repo
  # depends on the sibling sso monorepo through a `link:`, which does not
  # exist in the runner). See scripts/ci/frontend-install.sh.
  CI_SSO_CLIENT_VERSION: "0.4.0"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - back/vendor/
    - back/.composer/cache/
    - front/node_modules/.pnpm/
    - .cache/Cypress/

# Tags semver con prerelease opcional: vX.Y.Z, vX.Y.Z-alpha.N, vX.Y.Z-beta.N, vX.Y.Z-rc.N
.tag_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta|rc|dryrun)\.\d+)?$/'

# Gates rapidos de TEST: corren en branches, en merge requests y en tags.
# Build y deploy siguen siendo solo de tags.
# - En un MR, $CI_COMMIT_BRANCH no esta definido: hay que matchear el
#   pipeline source explicitamente.
# - En un pipeline de tag, $CI_COMMIT_BRANCH tampoco esta definido.
#
# Los jobs de LINT (.tag_rules) quedan solo en tags: el lint del repo
# (pint + eslint) tiene deuda acumulada y hoy ya falla en main, asi que
# correrlo en cada branch haria nacer cada MR con jobs rojos que no son
# suyos. En un pipeline de tag corren lint Y test: el tag es el unico
# lugar donde la deuda de lint tiene que frenarse.
.ci_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta|rc|dryrun)\.\d+)?$/'

# Setup SSH comun: usa SSH_KNOWN_HOSTS (CI var masked) en vez de ssh-keyscan
.ssh_setup:
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval $(ssh-agent -s) && ssh-add ~/.ssh/id_rsa
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - echo "Host *" > ~/.ssh/config
    - echo "  HostKeyAlgorithms +ssh-rsa" >> ~/.ssh/config
    - echo "  PubkeyAcceptedAlgorithms +ssh-rsa" >> ~/.ssh/config

# Setup composer comun: composer:2.8 + COMPOSER_HOME fijado
# La instalacion usa scripts/ci/backend-install.sh: en CI el servidor SSO
# (path: ../../sso/packages/sso-server) no existe y hay que resolverlo
# desde Packagist.
.composer_setup:
  before_script:
    - cd back
    - export COMPOSER_HOME="$CI_PROJECT_DIR/back/.composer"
    - $CI_PROJECT_DIR/scripts/ci/backend-install.sh

# Setup composer para lint (sin scripts/migrate)
.composer_lint_setup:
  before_script:
    - cd back
    - export COMPOSER_HOME="$CI_PROJECT_DIR/back/.composer"
    - $CI_PROJECT_DIR/scripts/ci/backend-install.sh --no-scripts

# Frontend Ionic Vue jobs
# La instalacion de dependencias usa scripts/ci/frontend-install.sh: en CI
# el cliente SSO (link: ../../sso/packages/sso-client) no existe y hay que
# resolverlo desde npm.
.frontend_setup:
  before_script:
    - cd front
    - corepack enable
    - "$CI_PROJECT_DIR/scripts/ci/frontend-install.sh"

# ============================================
# STAGE: lint
# ============================================

backend_lint:
  stage: lint
  image:
    name: composer:2.8
    entrypoint: [""]
  extends: [.tag_rules, .composer_lint_setup]
  script:
    - vendor/bin/pint --test

frontend_lint:
  stage: lint
  image: node:24.4-alpine
  extends: [.tag_rules, .frontend_setup]
  script:
    - pnpm run lint

# ============================================
# STAGE: test
# ============================================

backend_test:
  stage: test
  image:
    name: composer:2.8
    entrypoint: [""]
  extends: [.ci_rules, .composer_setup]
  variables:
    DB_CONNECTION: sqlite
    DB_DATABASE: ":memory:"
  before_script:
    - cd back
    - export COMPOSER_HOME="$CI_PROJECT_DIR/back/.composer"
    - cp .env.testing.example .env
    - $CI_PROJECT_DIR/scripts/ci/backend-install.sh
    - php artisan key:generate --force
    - mkdir -p keys
    - php artisan jwt:generate-keys || true
    - php artisan config:clear
  script:
    - php artisan test

frontend_test:
  stage: test
  image: node:24.4-alpine
  extends: [.ci_rules, .frontend_setup]
  script:
    - pnpm run test:unit

# E2E de frontend: build offline (bypass de auth + API local) servido por
# el harness y el suite de Cypress encima. Necesita glibc (el binario de
# Cypress no corre en alpine) y un display virtual.
frontend_e2e_test:
  stage: test
  image:
    name: node:24-bookworm
    entrypoint: [""]
  extends: [.ci_rules]
  variables:
    # El binario de Cypress se cachea en el directorio del proyecto para
    # que el cache de CI lo reuse.
    CYPRESS_CACHE_FOLDER: "$CI_PROJECT_DIR/.cache/Cypress"
    # Electron necesita estos flags dentro de un contenedor (el runner es
    # uno): sin ellos intenta spawnar un proceso de GPU y falla.
    ELECTRON_EXTRA_LAUNCH_ARGS: "--disable-gpu --disable-dev-shm-usage --no-sandbox"
  cache:
    paths:
      - front/node_modules/.pnpm/
      - .cache/Cypress/
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends xvfb xauth libgtk-3-0 libgbm1 libnotify4 libnss3 libxss1 libasound2 libxtst6
    - corepack enable
    - "$CI_PROJECT_DIR/scripts/ci/frontend-install.sh"
    - cd front
    - pnpm exec cypress install
    - pnpm exec cypress verify
  script:
    - xvfb-run -a pnpm run test:e2e
  artifacts:
    when: always
    paths:
      - front/tests/e2e/videos/
      - front/tests/e2e/screenshots/
    expire_in: 1h

# ============================================
# STAGE: build
# ============================================

backend_assets_build:
  stage: build
  image: node:24.4-alpine
  extends: [.tag_rules]
  before_script:
    - corepack enable
  script:
    - cd back
    - pnpm install --frozen-lockfile
    - pnpm exec vite build
  artifacts:
    paths:
      - back/public/build/
    expire_in: 1h

backend_build:
  stage: build
  image:
    name: composer:2.8
    entrypoint: [""]
  extends: [.tag_rules, .composer_setup]
  needs:
    - backend_assets_build
  script:
    - composer install --no-dev --optimize-autoloader --no-interaction
    - php artisan config:clear
    - php artisan route:clear
  artifacts:
    paths:
      - back/
    expire_in: 1h

frontend_build:
  stage: build
  image: node:24.4-alpine
  extends: [.tag_rules, .frontend_setup]
  script:
    - cp "$FRONTEND_ENV_FILE" .env.production
    - pnpm exec vite build
  artifacts:
    paths:
      - front/dist/
    expire_in: 1h

# ============================================
# STAGE: deploy
# ============================================

backend_deploy:
  stage: deploy
  image: alpine:3.20
  extends: [.ssh_setup, .tag_rules]
  needs:
    - backend_lint
    - backend_test
    - backend_build
  before_script:
    - !reference [.ssh_setup, before_script]
    - $CI_PROJECT_DIR/scripts/ci/backend-install.sh --no-dev
  script:
    - |
      tar -czf /tmp/backend.tar.gz \
        --exclude='.git' \
        --exclude='node_modules' \
        --exclude='vendor' \
        --exclude='.env' \
        --exclude='storage/logs/*' \
        --exclude='storage/app/*' \
        --exclude='storage/framework/cache/*' \
        --exclude='storage/framework/sessions/*' \
        --exclude='storage/framework/views/*' \
        --exclude='bootstrap/cache/*.php' \
        -C back .
    - scp -P "$SSH_PORT" /tmp/backend.tar.gz "$SSH_USER@$SSH_HOST:/tmp/backend.tar.gz"
    - |
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        mkdir -p $DEPLOY_PATH_BACKEND &&
        tar -xzf /tmp/backend.tar.gz -C $DEPLOY_PATH_BACKEND &&
        cd $DEPLOY_PATH_BACKEND &&
        composer install --no-dev --optimize-autoloader --no-interaction &&
        php artisan migrate --force &&
        php artisan config:cache &&
        php artisan route:cache &&
        rm /tmp/backend.tar.gz
      "

frontend_deploy:
  stage: deploy
  image: alpine:3.20
  extends: [.ssh_setup, .tag_rules]
  needs:
    - frontend_lint
    - frontend_test
    - frontend_build
  before_script:
    - !reference [.ssh_setup, before_script]
  script:
    - |
      tar -czf /tmp/frontend.tar.gz -C front/dist .
    - scp -P "$SSH_PORT" /tmp/frontend.tar.gz "$SSH_USER@$SSH_HOST:/tmp/frontend.tar.gz"
    - |
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        mkdir -p $DEPLOY_PATH_FRONTEND &&
        tar -xzf /tmp/frontend.tar.gz -C $DEPLOY_PATH_FRONTEND &&
        rm /tmp/frontend.tar.gz
      "



rollback_backend:
  stage: rollback
  image: alpine:3.20
  extends: [.ssh_setup, .tag_rules]
  when: manual
  before_script:
    - !reference [.ssh_setup, before_script]
    - apk add --no-cache git
  script:
    - |
      PREVIOUS_TAG=$(git tag --list "v*" --sort=-version:refname | sed -n '2p')
      if [ -z "$PREVIOUS_TAG" ]; then echo "No hay tag anterior para rollback"; exit 1; fi
      echo "Rolling back to $PREVIOUS_TAG"
      git fetch --tags
      git checkout "$PREVIOUS_TAG" -- back/
      tar -czf /tmp/backend-rollback.tar.gz \
        --exclude='.git' \
        --exclude='node_modules' \
        --exclude='vendor' \
        --exclude='.env' \
        --exclude='storage/logs/*' \
        --exclude='storage/app/*' \
        --exclude='storage/framework/cache/*' \
        --exclude='storage/framework/sessions/*' \
        --exclude='storage/framework/views/*' \
        --exclude='bootstrap/cache/*.php' \
        -C back .
      scp -P "$SSH_PORT" /tmp/backend-rollback.tar.gz "$SSH_USER@$SSH_HOST:/tmp/backend-rollback.tar.gz"
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        mkdir -p $DEPLOY_PATH_BACKEND &&
        tar -xzf /tmp/backend-rollback.tar.gz -C $DEPLOY_PATH_BACKEND &&
        cd $DEPLOY_PATH_BACKEND &&
        composer install --no-dev --optimize-autoloader --no-interaction &&
        php artisan migrate --force &&
        php artisan config:cache &&
        php artisan route:cache &&
        rm /tmp/backend-rollback.tar.gz
      "

rollback_frontend:
  stage: rollback
  image: node:24.4-alpine
  extends: [.ssh_setup, .tag_rules]
  when: manual
  before_script:
    - !reference [.ssh_setup, before_script]
    - apk add --no-cache git
    - corepack enable
  script:
    - |
      PREVIOUS_TAG=$(git tag --list "v*" --sort=-version:refname | sed -n '2p')
      if [ -z "$PREVIOUS_TAG" ]; then echo "No hay tag anterior para rollback"; exit 1; fi
      echo "Rolling back to $PREVIOUS_TAG"
      git fetch --tags
      git checkout "$PREVIOUS_TAG" -- front/
      cd front
      pnpm install --frozen-lockfile
      cp "$FRONTEND_ENV_FILE" .env.production
      pnpm exec vite build
      cd ..
      tar -czf /tmp/frontend-rollback.tar.gz -C front/dist .
      scp -P "$SSH_PORT" /tmp/frontend-rollback.tar.gz "$SSH_USER@$SSH_HOST:/tmp/frontend-rollback.tar.gz"
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        mkdir -p $DEPLOY_PATH_FRONTEND &&
        tar -xzf /tmp/frontend-rollback.tar.gz -C $DEPLOY_PATH_FRONTEND &&
        rm /tmp/frontend-rollback.tar.gz
      "