scalar DateTime
  @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

type Query {
  userAuth: UserAuthPayload
    @field(
      resolver: "App\\GraphQL\\Resolvers\\auth\\GetUserAuthResolver@resolve"
    )

  calendars: CalendarsPayload
    @field(
      resolver: "App\\GraphQL\\Resolvers\\events\\GetCalendarsResolver@resolve"
    )
}

type Mutation {
  register(input: RegisterInput @spread): Boolean
    @field(resolver: "App\\GraphQL\\Resolvers\\auth\\RegisterResolver@resolve")

  login(input: LoginInput @spread): LoginPayload
    @field(resolver: "App\\GraphQL\\Resolvers\\auth\\LoginResolver@resolve")

  # prueba(input: RegisterInput @spread): String
  #   @field(resolver: "App\\GraphQL\\Resolvers\\others\\TestResolver@resolve")
}

type User {
  id: ID!
  name: String!
  user: String!
}
type UserAuth {
  access_token: String!
  token_type: String!
}
type Calendar {
  id: String!
  name: String!
}

# inputs
input RegisterInput {
  name: String!
  user: String!
  email: String!
  password: String!
}
input LoginInput {
  user: String!
  password: String!
}

# payloads
type LoginPayload {
  auth: UserAuth!
}
type UserAuthPayload {
  user: User!
}
type CalendarsPayload {
  calendars: [Calendar]
}
