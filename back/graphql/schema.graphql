scalar DateTime
  @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

type Query {
  userAuth: UserAuthPayload
    @field(
      resolver: "App\\GraphQL\\Resolvers\\auth\\GetUserAuthResolver@resolve"
    )

  events(input: GetEvents @spread): EventsPayload
    @field(
      resolver: "App\\GraphQL\\Resolvers\\events\\GetUserEventsResolver@resolve"
    )
}

type Mutation {
  register(input: RegisterInput @spread): UserRegisterPayload
    @field(resolver: "App\\GraphQL\\Resolvers\\auth\\RegisterResolver@resolve")

  login(input: LoginInput @spread): LoginPayload
    @field(resolver: "App\\GraphQL\\Resolvers\\auth\\LoginResolver@resolve")

  # prueba(input: RegisterInput @spread): String
  #   @field(resolver: "App\\GraphQL\\Resolvers\\others\\TestResolver@resolve")

  createEvent(input: CreateEvent @spread): Boolean
    @field(
      resolver: "App\\GraphQL\\Resolvers\\events\\CreateEventResolver@resolve"
    )

  userLogout: UserLogoutPayload
    @field(
      resolver: "App\\GraphQL\\Resolvers\\auth\\UserLogoutResolver@resolve"
    )
}

type User {
  id: ID!
  name: String!
  email: String!
  user: String!
  image_profile: String
  calendars: [Calendar]
  events: [Event]
}
type UserAuth {
  access_token: String!
  token_type: String!
}
type Calendar {
  id: String!
  name: String!
  default: Boolean!
}
type Event {
  id: ID!
  user_id: ID!
  title: String!
  calendar: Calendar!
  time_start: String!
  time_end: String!
  guests: String!
  notes: String!
  reminders: String!
  repeats: String!
  tags: String!
  time_zone: String!
}

# inputs
input RegisterInput {
  name: String!
  user: String!
  email: String!
  password: String!
}
input LoginInput {
  user: String!
  password: String!
}
input CreateEvent {
  title: String
  calendar: String
  time_start: String
  time_end: String
  guests: String
  notes: String
  reminders: String
  repeats: String
  tags: String
  timeZone: String
}
input GetEvents {
  date: String!
}

# payloads
type LoginPayload {
  auth: UserAuth!
}
type UserAuthPayload {
  user: User!
}
type EventsPayload {
  events: [Event]
}

type UserLogoutPayload {
  state: Boolean!
}
type UserRegisterPayload {
  state: Boolean!
}
