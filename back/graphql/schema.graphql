type Query {
  userAuth: UserAuthPayload
    @field(
      resolver: "App\\GraphQL\\Resolvers\\auth\\GetUserAuthResolver@resolve"
    )

  events(input: GetEvents @spread): EventsPayload
    @field(
      resolver: "App\\GraphQL\\Resolvers\\events\\GetUserEventsResolver@resolve"
    )
}

type Mutation {
  register(input: RegisterInput @spread): UserRegisterPayload
    @field(resolver: "App\\GraphQL\\Resolvers\\auth\\RegisterResolver@resolve")

  login(input: LoginInput @spread): LoginPayload
    @field(resolver: "App\\GraphQL\\Resolvers\\auth\\LoginResolver@resolve")

  createEvent(input: CreateEventInput @spread): CreateEventPayload
    @field(
      resolver: "App\\GraphQL\\Resolvers\\events\\CreateEventResolver@resolve"
    )

  userLogout: UserLogoutPayload
    @field(
      resolver: "App\\GraphQL\\Resolvers\\auth\\UserLogoutResolver@resolve"
    )

  syncEvents(input: SyncEventsInput @spread): SyncEventsPayload
    @field(
      resolver: "App\\GraphQL\\Resolvers\\events\\SyncEventsResolver@resolve"
    )
}

type User {
  id: ID!
  name: String!
  email: String!
  user: String!
  image_profile: String
  calendars: [Calendar]
  events: [Event]
}
type UserAuth {
  access_token: String!
  token_type: String!
}
type Calendar {
  id: String!
  name: String!
  default: Boolean!
}
type Event {
  id: ID!
  user_id: ID!
  title: String!
  date_start: String!
  date_end: String!
  guests: String!
  notes: String!
  repeat: String!
  tags: String!
  time_zone: String!
  description: String!
  notifications: String!
  availability: String!
}

# inputs
input RegisterInput {
  name: String!
  user: String!
  email: String!
  password: String!
}
input LoginInput {
  user: String!
  password: String!
}
input CreateEventInput {
  id: String
  name: String!
  guests: String
  dateStart: String!
  dateEnd: String!
  notifications: String
  repeat: String
  timeZone: String!
  description: String
  availability: String!
  syncStatus: Boolean
}
input GetEvents {
  date: String!
}
input SyncEventsInput {
  id: String
  name: String!
  guests: String
  dateStart: String!
  dateEnd: String!
  notifications: String
  repeat: String
  timeZone: String!
  description: String
  availability: String!
  syncStatus: Boolean
}

# payloads
type LoginPayload {
  auth: UserAuth!
}
type UserAuthPayload {
  user: User!
}
type EventsPayload {
  events: [Event]
}

type UserLogoutPayload {
  state: Boolean!
}
type UserRegisterPayload {
  state: Boolean!
}
type SyncEventsPayload {
  state: Boolean!
}
type CreateEventPayload {
  id: String!
}
